<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcanum — Central Knowledge Archive</title><style>body{font-family:system-ui;margin:0;background:#0f0d16;color:#eee}header{padding:20px 6%;background:#171321;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:30px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#1b1725;border:1px solid #342c42;border-radius:14px;padding:20px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,input,textarea,select{font:inherit;border-radius:10px;border:1px solid #44394f;padding:10px;background:#15121c;color:#eee}button{cursor:pointer}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center}.box{background:#1b1725;padding:24px;border-radius:16px;width:min(560px,90%)}textarea{width:100%;min-height:160px;box-sizing:border-box}#app{display:none}.muted{color:#aaa}</style></head><body><header><strong>✦ ARCANUM</strong><span>Central Knowledge Archive</span><button onclick="logout()">Đăng xuất</button></header><main id="login"><div class="card"><h1>Đăng nhập Arcanum</h1><p class="muted">Một tài khoản duy nhất trên mọi thiết bị.</p><input id="username" placeholder="Tên tài khoản"><br><br><input id="password" type="password" placeholder="Mật khẩu"><br><br><input id="display" placeholder="Tên hiển thị (chỉ cần khi đăng ký)"><div class="actions"><button onclick="login()">Đăng nhập</button><button onclick="register()">Tạo tài khoản</button></div><p id="msg"></p></div></main><main id="app"><h1>Kho kiến thức</h1><p id="who" class="muted"></p><div class="actions"><button onclick="openEditor()">＋ Thêm kiến thức</button><button onclick="loadKnowledge()">↻ Đồng bộ</button><button onclick="loadDevices()">📱 Thiết bị</button><input id="search" placeholder="Tìm kiếm..." oninput="loadKnowledge()"></div><div id="knowledge" class="grid"></div><h2>Danh mục</h2><div id="cats" class="grid"></div><div id="devices"></div></main><div id="modal" class="modal"><div class="box"><h2>Kiến thức mới</h2><input id="title" placeholder="Tên kiến thức" style="width:100%;box-sizing:border-box"><br><br><input id="source" placeholder="Nguồn tham khảo" style="width:100%;box-sizing:border-box"><br><br><textarea id="content" placeholder="Nội dung"></textarea><br><br><select id="category" style="width:100%"></select><div class="actions"><button onclick="saveKnowledge()">Lưu</button><button onclick="closeEditor()">Hủy</button></div></div></div><script>const api='/api';let token=localStorage.getItem('arcanum_token');const $=id=>document.getElementById(id);function headers(){return {'Content-Type':'application/json',Authorization:'Bearer '+token}}async function request(url,opt={}){const r=await fetch(api+url,opt);if(r.status===401){logout();throw Error('login')}return r.json()}function show(){$('login').style.display=token?'none':'block';$('app').style.display=token?'block':'none';if(token)load()}async function login(){try{const r=await request('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim(),password:$('password').value,deviceName:navigator.userAgent})});if(!r.token)throw Error(r.error||'Login failed');token=r.token;localStorage.setItem('arcanum_token',token);show()}catch(e){$('msg').textContent=e.message==='login'?'Đăng nhập thất bại':(e.message||'Đăng nhập thất bại')}}async function register(){try{const username=$('username').value.trim();const password=$('password').value;const displayName=$('display').value.trim()||username;if(!username||!password)return $('msg').textContent='Vui lòng nhập tên tài khoản và mật khẩu';const email=username.toLowerCase()+'@arcanum.local';const r=await request('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,displayName})});token=r.token;localStorage.setItem('arcanum_token',token);show()}catch(e){$('msg').textContent='Không thể tạo tài khoản'}}function logout(){token=null;localStorage.removeItem('arcanum_token');show()}async function load(){const me=await request('/me');$('who').textContent=me.display_name+' · '+me.email;await loadCats();await loadKnowledge()}async function loadCats(){const cats=await request('/categories');$('cats').innerHTML=cats.map(c=>`<div class="card">📚 ${esc(c.name)}</div>`).join('')||'<div class="card">Chưa có danh mục</div>';$('category').innerHTML='<option value="">Không phân loại</option>'+cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}async function loadKnowledge(){const s=encodeURIComponent($('search').value||'');const data=await request('/knowledge?search='+s);$('knowledge').innerHTML=data.map(k=>`<article class="card"><h3>${esc(k.title)}</h3><small>${esc(k.category_name||'Chưa phân loại')} · v${k.version}</small><p>${esc((k.content||'').slice(0,220))}</p><small class="muted">${esc(k.owner_name||'')}</small></article>`).join('')||'<div class="card">Chưa có kiến thức.</div>'}function openEditor(){$('modal').style.display='flex'}function closeEditor(){$('modal').style.display='none'}async function saveKnowledge(){await request('/knowledge',{method:'POST',headers:headers(),body:JSON.stringify({title:$('title').value,source:$('source').value,content:$('content').value,categoryId:$('category').value||null})});$('title').value='';$('source').value='';$('content').value='';closeEditor();await loadKnowledge()}async function loadDevices(){const d=await request('/devices');$('devices').innerHTML='<h2>Thiết bị đăng nhập</h2>'+d.map(x=>`<div class="card">📱 ${esc(x.device_name||'Unknown')} · ${new Date(x.last_seen_at).toLocaleString()}</div>`).join('')}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}show();</script></body></html>
