services:
  - type: web
    name: arcanum-core
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: ""
    buildCommand: cd arcanum-core && npm install
    startCommand: cd arcanum-core && npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arcanum-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ARCANUM_ADMIN_USERNAME
        value: Arcanum111
      - key: ARCANUM_ADMIN_EMAIL
        value: arcanum111@arcanum.local
      - key: ARCANUM_ADMIN_PASSWORD
        sync: false

databases:
  - name: arcanum-db
    plan: free
    region: oregon
    databaseName: arcanum_db_zivc
    user: arcanum_db_zivc_user
    postgresMajorVersion: 18
